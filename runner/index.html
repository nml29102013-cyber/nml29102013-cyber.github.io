<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Rush - Ancient Ruins</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: #000;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hud-item {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            padding: 12px 24px;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .coins {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .coin-icon {
            width: 24px;
            height: 24px;
            background: radial-gradient(circle, #ffd700, #ff8c00);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
        }

        .start-screen, .game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255, 165, 0, 0.3), rgba(255, 140, 0, 0.3));
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 20;
        }

        .start-screen h1, .game-over-screen h1 {
            font-size: 72px;
            font-weight: 900;
            color: white;
            text-shadow: 4px 4px 8px rgba(0,0,0,0.7);
            margin-bottom: 20px;
            letter-spacing: 4px;
        }

        .game-over-screen h2 {
            font-size: 36px;
            color: white;
            margin-bottom: 30px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.7);
        }

        .final-score {
            font-size: 48px;
            color: #ffd700;
            font-weight: bold;
            margin-bottom: 40px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.7);
        }

        .restart-hint {
            font-size: 24px;
            color: white;
            animation: pulse 1.5s ease-in-out infinite;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid rgba(255, 255, 255, 0.1);
            border-top: 6px solid #ffd700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div class="ui-overlay">
        <div class="hud">
            <div class="hud-item">Score: <span id="score">0</span></div>
            <div class="hud-item coins">
                <div class="coin-icon"></div>
                <span id="coins">0</span>
            </div>
            <div class="hud-item">Speed: <span id="speed">0</span> km/h</div>
        </div>
    </div>

    <div class="start-screen" id="startScreen">
        <h1>CITY RUSH</h1>
        <p style="color: white; font-size: 24px; margin-bottom: 40px;">Ancient Ruins</p>
        <p class="restart-hint">Нажми ПРОБЕЛ или тапни для старта</p>
    </div>

    <div class="game-over-screen hidden" id="gameOverScreen">
        <h1>GAME OVER</h1>
        <div class="final-score">Score: <span id="finalScore">0</span></div>
        <p class="restart-hint">Нажми ПРОБЕЛ или тапни для рестарта</p>
    </div>

    <div class="loading-screen" id="loadingScreen">
        <div class="spinner"></div>
        <div class="loading-text">Загрузка...</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const canvas = document.getElementById('gameCanvas');
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x2d4a22, 20, 80);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const hemisphereLight = new THREE.HemisphereLight(0x87ceeb, 0x2d4a22, 0.6);
        scene.add(hemisphereLight);

        const directionalLight = new THREE.DirectionalLight(0xffd700, 1.5);
        directionalLight.position.set(10, 20, 10);
        directionalLight.castShadow = true;
        directionalLight.shadow.camera.left = -20;
        directionalLight.shadow.camera.right = 20;
        directionalLight.shadow.camera.top = 20;
        directionalLight.shadow.camera.bottom = -20;
        directionalLight.shadow.camera.near = 0.1;
        directionalLight.shadow.camera.far = 100;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        scene.add(directionalLight);

        scene.background = new THREE.Color(0x2d4a22);

        let gameState = 'start';
        let score = 0;
        let coins = 0;
        let speed = 10;
        let maxSpeed = 25;
        let playerBaseY = 0;
        let isJumping = false;
        let velocityY = 0;
        const gravity = -25;
        const jumpForce = 12;
        const laneWidth = 3;
        let currentLane = 0;
        let targetLane = 0;
        let player = null;
        let playerMixer = null;

        const roadSegments = [];
        const buildings = [];
        const obstacles = [];
        const coinObjects = [];
        const particles = [];

        function createFallbackPlayer() {
            const geometry = new THREE.CapsuleGeometry(0.5, 1.5, 8, 16);
            const material = new THREE.MeshStandardMaterial({ 
                color: 0xff6b6b,
                metalness: 0.3,
                roughness: 0.7
            });
            player = new THREE.Mesh(geometry, material);
            player.position.set(0, 1.25, 0);
            player.castShadow = true;
            player.receiveShadow = true;
            scene.add(player);
            playerBaseY = 1.25;
        }

        const loader = new GLTFLoader();
        loader.load(
            'player_game.glb',
            (gltf) => {
                player = gltf.scene;
                
                const box = new THREE.Box3().setFromObject(player);
                const height = box.max.y - box.min.y;
                const scale = 2.0 / height;
                player.scale.set(scale, scale, scale);
                
                const newBox = new THREE.Box3().setFromObject(player);
                playerBaseY = -newBox.min.y;
                player.position.set(0, playerBaseY, 0);
                
                player.rotation.y = Math.PI;
                
                player.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });
                
                scene.add(player);
                
                if (gltf.animations && gltf.animations.length > 0) {
                    playerMixer = new THREE.AnimationMixer(player);
                    const runClip = gltf.animations.find(clip => 
                        clip.name.toLowerCase().includes('run') || 
                        clip.name.toLowerCase().includes('walk')
                    );
                    if (runClip) {
                        const action = playerMixer.clipAction(runClip);
                        action.play();
                    }
                }
                
                document.getElementById('loadingScreen').classList.add('hidden');
            },
            undefined,
            (error) => {
                console.log('Модель не найдена, используем fallback');
                createFallbackPlayer();
                document.getElementById('loadingScreen').classList.add('hidden');
            }
        );

        function createRoadSegment(z) {
            const group = new THREE.Group();
            
            const roadGeometry = new THREE.BoxGeometry(9, 0.1, 20);
            const roadMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x4a4a4a,
                roughness: 0.8,
                metalness: 0.2
            });
            const road = new THREE.Mesh(roadGeometry, roadMaterial);
            road.position.set(0, 0, z);
            road.receiveShadow = true;
            group.add(road);
            
            for (let i = -1; i <= 1; i += 2) {
                const lineGeometry = new THREE.BoxGeometry(0.1, 0.11, 20);
                const lineMaterial = new THREE.MeshStandardMaterial({ 
                    color: 0x00ff00,
                    emissive: 0x00ff00,
                    emissiveIntensity: 0.5
                });
                const line = new THREE.Mesh(lineGeometry, lineMaterial);
                line.position.set(i * 1.5, 0.05, z);
                group.add(line);
            }
            
            for (let i = -1; i <= 1; i += 2) {
                const curbGeometry = new THREE.BoxGeometry(0.5, 0.3, 20);
                const curbMaterial = new THREE.MeshStandardMaterial({ 
                    color: 0x8b7355,
                    roughness: 0.9
                });
                const curb = new THREE.Mesh(curbGeometry, curbMaterial);
                curb.position.set(i * 5, 0.15, z);
                curb.castShadow = true;
                curb.receiveShadow = true;
                group.add(curb);
            }
            
            scene.add(group);
            roadSegments.push({ group, z });
        }

        function createBuilding(x, z) {
            const group = new THREE.Group();
            const height = 5 + Math.random() * 15;
            const width = 2 + Math.random() * 3;
            const depth = 2 + Math.random() * 3;
            
            const buildingGeometry = new THREE.BoxGeometry(width, height, depth);
            const buildingMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x6b5d4f,
                roughness: 0.9
            });
            const building = new THREE.Mesh(buildingGeometry, buildingMaterial);
            building.position.set(x, height / 2, z);
            building.castShadow = true;
            building.receiveShadow = true;
            group.add(building);
            
            const runeCount = Math.floor(Math.random() * 3) + 1;
            for (let i = 0; i < runeCount; i++) {
                const runeGeometry = new THREE.PlaneGeometry(0.3, 0.5);
                const runeColor = Math.random() > 0.5 ? 0x00ff7f : 0xff8c00;
                const runeMaterial = new THREE.MeshStandardMaterial({ 
                    color: runeColor,
                    emissive: runeColor,
                    emissiveIntensity: 0.8,
                    side: THREE.DoubleSide
                });
                const rune = new THREE.Mesh(runeGeometry, runeMaterial);
                rune.position.set(
                    x + (Math.random() - 0.5) * width * 0.8,
                    1 + Math.random() * (height - 2),
                    z + depth / 2 + 0.01
                );
                group.add(rune);
            }
            
            scene.add(group);
            buildings.push({ group, z });
        }

        function createObstacle(lane, z, isLow) {
            const group = new THREE.Group();
            const x = lane * laneWidth;
            
            if (isLow) {
                const geometry = new THREE.CylinderGeometry(0.5, 0.5, 3, 8);
                const material = new THREE.MeshStandardMaterial({ 
                    color: 0x8b7355,
                    roughness: 0.9
                });
                const obstacle = new THREE.Mesh(geometry, material);
                obstacle.rotation.z = Math.PI / 2;
                obstacle.position.set(x, 0.5, z);
                obstacle.castShadow = true;
                obstacle.receiveShadow = true;
                group.add(obstacle);
            } else {
                const geometry = new THREE.BoxGeometry(1.5, 2, 1.5);
                const material = new THREE.MeshStandardMaterial({ 
                    color: 0x654321,
                    roughness: 0.8
                });
                const obstacle = new THREE.Mesh(geometry, material);
                obstacle.position.set(x, 1, z);
                obstacle.castShadow = true;
                obstacle.receiveShadow = true;
                group.add(obstacle);
            }
            
            scene.add(group);
            obstacles.push({ group, lane, z, isLow });
        }

        function createCoin(lane, z) {
            const geometry = new THREE.CylinderGeometry(0.3, 0.3, 0.1, 16);
            const material = new THREE.MeshStandardMaterial({ 
                color: 0xffd700,
                emissive: 0xff8c00,
                emissiveIntensity: 0.5,
                metalness: 0.8,
                roughness: 0.2
            });
            const coin = new THREE.Mesh(geometry, material);
            coin.rotation.x = Math.PI / 2;
            coin.position.set(lane * laneWidth, 1.5, z);
            coin.castShadow = true;
            scene.add(coin);
            coinObjects.push({ mesh: coin, lane, z, collected: false });
        }

        function createExplosion(position) {
            const particleCount = 30;
            const colors = [0x8b7355, 0x6b5d4f, 0x4a4a4a];
            
            for (let i = 0; i < particleCount; i++) {
                const geometry = new THREE.BoxGeometry(0.2, 0.2, 0.2);
                const material = new THREE.MeshStandardMaterial({ 
                    color: colors[Math.floor(Math.random() * colors.length)]
                });
                const particle = new THREE.Mesh(geometry, material);
                particle.position.copy(position);
                
                const velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 10,
                    Math.random() * 10,
                    (Math.random() - 0.5) * 10
                );
                
                scene.add(particle);
                particles.push({ mesh: particle, velocity, life: 1.0 });
            }
        }

        function initLevel() {
            for (let i = 0; i < 10; i++) {
                createRoadSegment(-i * 20);
            }
            
            for (let i = 0; i < 20; i++) {
                const z = -i * 10;
                createBuilding(-8, z);
                createBuilding(8, z);
            }
        }

        function spawnObjects() {
            const furthestZ = Math.min(...obstacles.map(o => o.z), ...coinObjects.map(c => c.z));
            const spawnZ = furthestZ - 30;
            
            if (Math.random() > 0.3) {
                const lane = Math.floor(Math.random() * 3) - 1;
                const isLow = Math.random() > 0.5;
                createObstacle(lane, spawnZ, isLow);
            }
            
            if (Math.random() > 0.4) {
                const lane = Math.floor(Math.random() * 3) - 1;
                createCoin(lane, spawnZ);
            }
        }

        function update(delta) {
            if (gameState !== 'playing') return;
            
            speed = Math.min(speed + delta * 0.5, maxSpeed);
            
            const moveDistance = speed * delta;
            player.position.z -= moveDistance;
            
            const targetX = targetLane * laneWidth;
            player.position.x += (targetX - player.position.x) * 5 * delta;
            
            const laneDiff = targetX - player.position.x;
            player.rotation.z = -laneDiff * 0.1;
            
            if (isJumping) {
                velocityY += gravity * delta;
                player.position.y += velocityY * delta;
                
                if (player.position.y <= playerBaseY) {
                    player.position.y = playerBaseY;
                    isJumping = false;
                    velocityY = 0;
                }
            }
            
            camera.position.x = player.position.x * 0.3;
            camera.position.y = player.position.y + 5;
            camera.position.z = player.position.z + 10;
            camera.lookAt(player.position.x, player.position.y, player.position.z - 5);
            
            roadSegments.forEach(segment => {
                if (segment.z > player.position.z + 20) {
                    segment.z -= 200;
                    segment.group.position.z = segment.z;
                }
            });
            
            buildings.forEach(building => {
                if (building.z > player.position.z + 20) {
                    building.z -= 200;
                    building.group.position.z = building.z;
                }
            });
            
            spawnObjects();
            
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obstacle = obstacles[i];
                
                if (obstacle.z > player.position.z + 20) {
                    scene.remove(obstacle.group);
                    obstacles.splice(i, 1);
                    continue;
                }
                
                const dx = Math.abs(player.position.x - obstacle.group.position.x);
                const dz = Math.abs(player.position.z - obstacle.z);
                const dy = player.position.y - playerBaseY;
                
                if (dx < 1 && dz < 1.5) {
                    if (obstacle.isLow && dy > 1.5) {
                        // Перепрыгнул
                    } else if (!obstacle.isLow && dx > 1.5) {
                        // Обошел
                    } else {
                        gameOver();
                    }
                }
            }
            
            coinObjects.forEach((coin, index) => {
                if (coin.collected) return;
                
                coin.mesh.rotation.y += delta * 2;
                
                if (coin.z > player.position.z + 20) {
                    scene.remove(coin.mesh);
                    coin.collected = true;
                    return;
                }
                
                const dx = Math.abs(player.position.x - coin.mesh.position.x);
                const dz = Math.abs(player.position.z - coin.z);
                const dy = Math.abs(player.position.y - coin.mesh.position.y);
                
                if (dx < 1 && dz < 1 && dy < 1.5) {
                    scene.remove(coin.mesh);
                    coin.collected = true;
                    coins++;
                    score += 10;
                }
            });
            
            for (let i = particles.length - 1; i >= 0; i--) {
                const particle = particles[i];
                particle.velocity.y += gravity * delta;
                particle.mesh.position.add(particle.velocity.clone().multiplyScalar(delta));
                particle.life -= delta * 2;
                particle.mesh.material.opacity = particle.life;
                
                if (particle.life <= 0) {
                    scene.remove(particle.mesh);
                    particles.splice(i, 1);
                }
            }
            
            score += moveDistance * 0.1;
            
            document.getElementById('score').textContent = Math.floor(score);
            document.getElementById('coins').textContent = coins;
            document.getElementById('speed').textContent = Math.floor(speed * 3.6);
        }

        function gameOver() {
            gameState = 'gameover';
            createExplosion(player.position);
            
            document.getElementById('finalScore').textContent = Math.floor(score);
            document.getElementById('gameOverScreen').classList.remove('hidden');
        }

        function restart() {
            gameState = 'playing';
            score = 0;
            coins = 0;
            speed = 10;
            currentLane = 0;
            targetLane = 0;
            isJumping = false;
            velocityY = 0;
            
            player.position.set(0, playerBaseY, 0);
            player.rotation.set(0, Math.PI, 0);
            
            obstacles.forEach(o => scene.remove(o.group));
            obstacles.length = 0;
            coinObjects.forEach(c => scene.remove(c.mesh));
            coinObjects.length = 0;
            particles.forEach(p => scene.remove(p.mesh));
            particles.length = 0;
            
            document.getElementById('gameOverScreen').classList.add('hidden');
        }

        const keys = {};
        
        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            
            if (gameState === 'start' && e.code === 'Space') {
                gameState = 'playing';
                document.getElementById('startScreen').classList.add('hidden');
            } else if (gameState === 'gameover' && e.code === 'Space') {
                restart();
            } else if (gameState === 'playing') {
                if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
                    targetLane = Math.max(-1, targetLane - 1);
                } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
                    targetLane = Math.min(1, targetLane + 1);
                } else if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
                    if (!isJumping) {
                        isJumping = true;
                        velocityY = jumpForce;
                    }
                }
            }
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        let touchStartX = 0;
        let touchStartY = 0;
        
        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            
            if (gameState === 'start') {
                gameState = 'playing';
                document.getElementById('startScreen').classList.add('hidden');
            } else if (gameState === 'gameover') {
                restart();
            }
        });
        
        canvas.addEventListener('touchend', (e) => {
            if (gameState !== 'playing') return;
            
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;
            
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 30) {
                    targetLane = Math.min(1, targetLane + 1);
                } else if (dx < -30) {
                    targetLane = Math.max(-1, targetLane - 1);
                }
            } else {
                if (dy < -30 && !isJumping) {
                    isJumping = true;
                    velocityY = jumpForce;
                }
            }
        });

        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = Math.min(clock.getDelta(), 0.05);
            
            if (playerMixer) {
                playerMixer.update(delta);
            }
            
            update(delta);
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        initLevel();
        animate();
    </script>
</body>
</html>
